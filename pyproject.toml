[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-archive-guard"
version = "0.1.0"
description = "Scan chat exports locally without modifying them, and flag potential secrets, personal-data patterns, JSON/JSONL errors, SQLite integrity problems, and scan gaps."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Project contributors"}]
dependencies = []
keywords = [
  "archive-integrity",
  "chat-archive",
  "chat-export",
  "jsonl",
  "log-scanning",
  "offline-scanner",
  "personal-data-scanning",
  "privacy",
  "privacy-audit",
  "read-only",
  "security",
  "secret-scanning",
  "sqlite",
  "sqlite-fts",
  "wal",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MaxHu-xuan/chat-archive-guard"
Repository = "https://github.com/MaxHu-xuan/chat-archive-guard"
Documentation = "https://github.com/MaxHu-xuan/chat-archive-guard#readme"
Issues = "https://github.com/MaxHu-xuan/chat-archive-guard/issues"
Changelog = "https://github.com/MaxHu-xuan/chat-archive-guard/blob/main/CHANGELOG.md"
Security = "https://github.com/MaxHu-xuan/chat-archive-guard/security/policy"

[project.scripts]
chat-archive-guard = "chat_archive_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

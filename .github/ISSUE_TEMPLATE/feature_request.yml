name: Feature request
description: Propose a focused improvement that preserves privacy boundaries
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Explain the user need with synthetic examples. Proposals must preserve
        local-only, read-only, values-free, and fail-closed behavior.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe who is affected and what cannot be done today, without real archive details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected result, limits, failure categories, and platform behavior.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary confirmation
      options:
        - label: The proposal requires no network access or telemetry.
          required: true
        - label: The proposal does not require outputting matched values or absolute paths.
          required: true
        - label: All examples are synthetic and contain no private information.
          required: true

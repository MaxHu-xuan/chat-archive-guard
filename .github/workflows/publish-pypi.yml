name: Publish reviewed release to PyPI

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: chat-archive-guard-pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release assets
    if: >-
      github.repository == 'MaxHu-xuan/chat-archive-guard' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      SOURCE_DATE_EPOCH: "946684800"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      EXPECTED_VERSION: "0.1.0"
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify tag, version, and main ancestry
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          expected_repository = "MaxHu-xuan/chat-archive-guard"
          expected_version = os.environ["EXPECTED_VERSION"]
          release_tag = os.environ["RELEASE_TAG"]
          if os.environ.get("GITHUB_REPOSITORY") != expected_repository:
              raise SystemExit("release repository identity mismatch")
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", release_tag):
              raise SystemExit("release tag is not a stable semantic version")
          if release_tag != f"v{expected_version}":
              raise SystemExit("release tag does not match the approved version")

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          release = event.get("release") or {}
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise SystemExit("only a published, non-prerelease release may continue")
          if event.get("action") != "published":
              raise SystemExit("release event action mismatch")
          if release.get("tag_name") != release_tag:
              raise SystemExit("release event tag mismatch")

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          if project.get("name") != "chat-archive-guard" or project.get("version") != expected_version:
              raise SystemExit("project name or version mismatch")

          def git(*arguments: str) -> str:
              return subprocess.check_output(("git", *arguments), text=True).strip()

          head = git("rev-parse", "HEAD")
          tag_commit = git("rev-parse", f"{release_tag}^{{commit}}")
          github_sha = os.environ.get("GITHUB_SHA")
          if head != tag_commit or head != github_sha:
              raise SystemExit("checked-out commit does not match the release tag")
          if (
              os.environ.get("GITHUB_REF") != f"refs/tags/{release_tag}"
              or os.environ.get("GITHUB_REF_TYPE") != "tag"
              or os.environ.get("GITHUB_REF_NAME") != release_tag
          ):
              raise SystemExit("workflow release reference mismatch")
          if os.environ.get("GITHUB_WORKFLOW_SHA") != github_sha:
              raise SystemExit("workflow definition does not come from the release commit")
          subprocess.run(
              ("git", "merge-base", "--is-ancestor", head, "origin/main"),
              check=True,
          )
          print(f"release identity: OK ({release_tag}, {head})")
          PY

      - name: Audit the checked-out source
        env:
          PYTHONPATH: src
        run: |
          python scripts/privacy_audit.py
          python scripts/privacy_audit.py --self-test
          python scripts/canonicalize_sdist.py --self-test
          python scripts/generate_demo.py --self-test
          python -X dev -W error::ResourceWarning -m unittest discover -s tests -q

      - name: Download the exact release asset allowlist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          expected = {
              "SOURCE_COMMIT": 256,
              "SHA256SUMS": 4096,
              "chat_archive_guard-0.1.0.cdx.json": 262_144,
              "chat_archive_guard-0.1.0-py3-none-any.whl": 16_777_216,
              "chat_archive_guard-0.1.0.tar.gz": 16_777_216,
          }
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          assets = (event.get("release") or {}).get("assets") or []
          if any(not isinstance(asset, dict) for asset in assets):
              raise SystemExit("release asset metadata is malformed")
          names = [asset.get("name") for asset in assets]
          if any(not isinstance(name, str) for name in names):
              raise SystemExit("release asset name is malformed")
          if len(names) != len(expected) or set(names) != set(expected):
              raise SystemExit("release asset allowlist mismatch")
          if len(names) != len(set(names)):
              raise SystemExit("release contains duplicate asset names")

          declared_total = 0
          for asset in assets:
              name = asset["name"]
              declared_size = asset.get("size")
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"release asset is not uploaded: {name}")
              if not isinstance(declared_size, int) or not (0 < declared_size <= expected[name]):
                  raise SystemExit(f"release asset size is invalid: {name}")
              declared_total += declared_size
          if declared_total > sum(expected.values()):
              raise SystemExit("release asset total size is invalid")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(
                  self, request, file_pointer, code, message, headers, new_url
              ):
                  return None

          token = os.environ.get("GITHUB_TOKEN")
          if not token:
              raise SystemExit("GitHub release asset token is unavailable")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          if repository != "MaxHu-xuan/chat-archive-guard":
              raise SystemExit("release asset repository identity mismatch")
          api_path = f"/repos/{repository}/releases/assets/"
          opener = urllib.request.build_opener(NoRedirect)

          destination = pathlib.Path("release-assets")
          destination.mkdir(mode=0o700)
          for asset in sorted(assets, key=lambda item: str(item.get("name"))):
              name = str(asset["name"])
              declared_size = asset.get("size")
              api_url = asset.get("url")
              try:
                  parsed = urllib.parse.urlparse(api_url or "")
                  invalid_api_url = (
                      parsed.scheme != "https"
                      or parsed.hostname != "api.github.com"
                      or parsed.username is not None
                      or parsed.password is not None
                      or parsed.port is not None
                      or bool(parsed.query)
                      or bool(parsed.fragment)
                      or re.fullmatch(re.escape(api_path) + r"[0-9]+", parsed.path) is None
                  )
              except (TypeError, ValueError):
                  invalid_api_url = True
              if invalid_api_url:
                  raise SystemExit(f"release asset API URL is invalid: {name}")
              request = urllib.request.Request(
                  api_url,
                  headers={
                      "Accept": "application/octet-stream",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "chat-archive-guard-release-verifier",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              response = None
              try:
                  response = opener.open(request, timeout=60)
              except urllib.error.HTTPError as error:
                  if error.code not in {301, 302, 303, 307, 308}:
                      error.close()
                      raise SystemExit(f"release asset download failed: {name}") from None
                  location = error.headers.get("Location")
                  error.close()
                  try:
                      redirect = urllib.parse.urlparse(location or "")
                      invalid_redirect = (
                          redirect.scheme != "https"
                          or redirect.hostname is None
                          or not redirect.hostname.endswith(".githubusercontent.com")
                          or redirect.username is not None
                          or redirect.password is not None
                          or redirect.port is not None
                          or bool(redirect.fragment)
                      )
                  except (TypeError, ValueError):
                      invalid_redirect = True
                  if invalid_redirect:
                      raise SystemExit(f"release asset redirect is unsafe: {name}")
                  try:
                      response = opener.open(
                          urllib.request.Request(
                              location,
                              headers={"User-Agent": "chat-archive-guard-release-verifier"},
                          ),
                          timeout=60,
                      )
                  except (OSError, urllib.error.HTTPError, urllib.error.URLError):
                      raise SystemExit(f"release asset download failed: {name}") from None
              except (OSError, urllib.error.URLError):
                  raise SystemExit(f"release asset download failed: {name}") from None
              if response is None:
                  raise SystemExit(f"release asset download failed: {name}")
              target = destination / name
              descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              total = 0
              try:
                  with os.fdopen(descriptor, "wb") as output, response:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > expected[name]:
                              raise SystemExit(f"release asset exceeds its size limit: {name}")
                          output.write(chunk)
              except BaseException:
                  target.unlink(missing_ok=True)
                  raise
              if total != declared_size:
                  target.unlink(missing_ok=True)
                  raise SystemExit(f"release asset size changed during download: {name}")
          print("release asset allowlist: OK")
          PY

      - name: Verify source identity, checksums, and SBOM identity
        id: release_hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path("release-assets")
          head = subprocess.check_output(("git", "rev-parse", "HEAD"), text=True).strip()
          source_commit = (root / "SOURCE_COMMIT").read_text(encoding="ascii")
          if source_commit != f"{head}\n":
              raise SystemExit("SOURCE_COMMIT does not match the release tag")

          expected_hashed_assets = {
              "chat_archive_guard-0.1.0.cdx.json",
              "chat_archive_guard-0.1.0-py3-none-any.whl",
              "chat_archive_guard-0.1.0.tar.gz",
          }
          rows = {}
          for line in (root / "SHA256SUMS").read_text(encoding="ascii").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9_.-]+)", line)
              if match is None or match.group(2) in rows:
                  raise SystemExit("SHA256SUMS has an invalid or duplicate row")
              rows[match.group(2)] = match.group(1)
          if set(rows) != expected_hashed_assets:
              raise SystemExit("SHA256SUMS asset set mismatch")
          for name, expected_digest in rows.items():
              observed = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if observed != expected_digest:
                  raise SystemExit(f"SHA-256 mismatch: {name}")

          sbom = json.loads((root / "chat_archive_guard-0.1.0.cdx.json").read_text(encoding="utf-8"))
          component = ((sbom.get("metadata") or {}).get("component") or {})
          if (
              sbom.get("bomFormat") != "CycloneDX"
              or sbom.get("specVersion") != "1.6"
              or component.get("name") != "chat-archive-guard"
              or component.get("version") != "0.1.0"
          ):
              raise SystemExit("SBOM project identity mismatch")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(
                  "wheel_sha256="
                  + rows["chat_archive_guard-0.1.0-py3-none-any.whl"]
                  + "\n"
              )
              output.write(
                  "sdist_sha256="
                  + rows["chat_archive_guard-0.1.0.tar.gz"]
                  + "\n"
              )
          print("release asset identity and hashes: OK")
          PY

      - name: Verify canonical sdist and audit its unpacked tree
        shell: bash
        run: |
          mkdir canonical-check unpacked
          python scripts/canonicalize_sdist.py \
            release-assets/chat_archive_guard-0.1.0.tar.gz \
            canonical-check/chat_archive_guard-0.1.0.tar.gz \
            --source-date-epoch 946684800
          cmp --silent \
            release-assets/chat_archive_guard-0.1.0.tar.gz \
            canonical-check/chat_archive_guard-0.1.0.tar.gz
          tar -xzf canonical-check/chat_archive_guard-0.1.0.tar.gz -C unpacked
          sdist_dir="$(find unpacked -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$sdist_dir"
          test "$(find unpacked -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" -eq 1
          python scripts/privacy_audit.py --sdist "$sdist_dir"
          python scripts/privacy_audit.py --sdist --self-test "$sdist_dir"

      - name: Stage only the publishable distributions
        env:
          EXPECTED_SDIST_SHA256: ${{ steps.release_hashes.outputs.sdist_sha256 }}
          EXPECTED_WHEEL_SHA256: ${{ steps.release_hashes.outputs.wheel_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import shutil

          source = pathlib.Path("release-assets")
          destination = pathlib.Path("publish-dist")
          destination.mkdir()
          expected = {
              "chat_archive_guard-0.1.0-py3-none-any.whl": os.environ["EXPECTED_WHEEL_SHA256"],
              "chat_archive_guard-0.1.0.tar.gz": os.environ["EXPECTED_SDIST_SHA256"],
          }
          for name, expected_digest in expected.items():
              if re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None:
                  raise SystemExit("saved release digest is invalid")
              observed_digest = hashlib.sha256((source / name).read_bytes()).hexdigest()
              if observed_digest != expected_digest:
                  raise SystemExit(f"release asset changed after verification: {name}")
              target = destination / name
              shutil.copyfile(source / name, target)
              target.chmod(0o644)
          observed = {path.name for path in pathlib.Path("publish-dist").iterdir() if path.is_file()}
          if observed != set(expected):
              raise SystemExit("publish directory allowlist mismatch")
          print("publish directory allowlist: OK")
          PY

      - name: Upload the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-archive-guard-pypi-${{ github.sha }}
          path: publish-dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Install the wheel offline and smoke-test both entry points
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            release-assets/chat_archive_guard-0.1.0-py3-none-any.whl
          (
            cd "$RUNNER_TEMP"
            test "$(env -u PYTHONPATH "$RUNNER_TEMP/wheel-smoke/bin/chat-archive-guard" --version)" = "$EXPECTED_VERSION"
            test "$(env -u PYTHONPATH "$RUNNER_TEMP/wheel-smoke/bin/python" -m chat_archive_guard --version)" = "$EXPECTED_VERSION"
          )

  publish:
    name: Publish verified distributions to PyPI
    needs:
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/chat-archive-guard
    permissions:
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chat-archive-guard-pypi-${{ github.sha }}
          path: publish-dist/
          digest-mismatch: error

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          verify-metadata: true
          skip-existing: false
          attestations: true
          print-hash: true
          verbose: false

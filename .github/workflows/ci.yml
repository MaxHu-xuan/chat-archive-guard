name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-archive-guard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run values-free privacy audit
        run: python scripts/privacy_audit.py
      - name: Test privacy-audit canary
        run: python scripts/privacy_audit.py --self-test
      - name: Run synthetic unit tests
        run: python -X dev -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Build wheel for cross-platform install smoke
        if: matrix.python-version == '3.14'
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir wheelhouse .
      - name: Install wheel without an index
        if: matrix.python-version == '3.14'
        run: python -m pip install --disable-pip-version-check --no-index --no-deps --force-reinstall --find-links wheelhouse "chat-archive-guard==0.1.0"
      - name: Smoke-test installed entry points
        if: matrix.python-version == '3.14'
        env:
          PYTHONPATH: ""
        run: |
          chat-archive-guard --version
          python -m chat_archive_guard --version

  package:
    name: Build, audit, and install distributions
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned build frontend
        run: python -m pip install --disable-pip-version-check "build==1.3.0"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Audit unpacked source distribution
        shell: bash
        run: |
          mkdir unpacked
          tar -xzf "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" -C unpacked
          sdist_dir="$(find unpacked -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python scripts/privacy_audit.py --sdist "$sdist_dir"
          python scripts/privacy_audit.py --sdist --self-test "$sdist_dir"
      - name: Install wheel without an index
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-index --no-deps --force-reinstall dist/*.whl
      - name: Smoke-test installed commands outside the checkout
        working-directory: /tmp
        run: |
          chat-archive-guard --version
          python -m chat_archive_guard --version
      - name: Verify installed values-free diagnostic
        shell: bash
        working-directory: /tmp
        run: |
          demo_dir="$(mktemp -d)"
          report_file="$(mktemp)"
          trap 'rm -r "$demo_dir"; rm -f "$report_file"' EXIT
          demo_dir="$(cd "$demo_dir" && pwd -P)"
          printf '%s\n' '{invalid' > "$demo_dir/broken.json"
          chmod 600 "$demo_dir/broken.json"
          set +e
          chat-archive-guard "$demo_dir" --json > "$report_file"
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json, pathlib, sys; data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")); assert data["ok"] is False; assert data["summary"]["categories"] == {"format.invalid_json": 1}' "$report_file"
